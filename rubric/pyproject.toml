[project]
name = "rubric-rlaif"
version = "0.1.0"
description = "Rubric-based RLAIF (Rubrics as Rewards) — single-A100 GRPO recipe"
# Target host: runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04
requires-python = ">=3.11,<3.12"
# Core needs: build data + talk to an OpenAI-compatible grader. Kept light so
# `generate_data.py` / the grader run anywhere. The heavy RL/GPU stack is in
# the `train` extra.
dependencies = [
    "openai>=1.40",
    "datasets>=2.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The A100 training stack. torch is intentionally NOT listed: the RunPod image
# ships torch 2.8.0+cu128 and it satisfies trl/transformers' torch requirement,
# so uv leaves it untouched. (Listing it — especially with a pinned index source
# — makes uv "correct" the provenance and redownload the ~850MB wheel.) If you're
# on a machine WITHOUT torch, install it first from the cu128 index:
#     uv pip install --system torch==2.8.0 --index https://download.pytorch.org/whl/cu128
# vLLM is also excluded here — TRL trains fine with plain transformers generation.
train = [
    "trl>=0.15",
    "transformers>=4.51",
    "peft>=0.14",
    "accelerate>=1.2",
]

# Optional: fast generation during training via colocated vLLM. Heavy install;
# skip it if the grader is remote and you're fine with slower HF generation
# (run train.py with --no-use-vllm in that case). vllm>=0.10.1 supports torch 2.8.
vllm = ["vllm>=0.10.1"]
