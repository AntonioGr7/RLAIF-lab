[project]
name = "rubric-rlaif"
version = "0.1.0"
description = "Rubric-based RLAIF (Rubrics as Rewards) — single-A100 GRPO recipe"
# Target host: runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04
requires-python = ">=3.11,<3.12"
# Core needs: build data + talk to an OpenAI-compatible grader. Kept light so
# `generate_data.py` / the grader run anywhere. The heavy RL/GPU stack is in
# the `train` extra.
dependencies = [
    "openai>=1.40",
    "datasets>=2.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The A100 training stack. torch is pinned to the RunPod image's preinstalled
# 2.8.0 (cu128) so uv reuses it instead of pulling a mismatched build. NOTE:
# vLLM is intentionally NOT here — TRL trains fine with plain `transformers`
# generation. Add the `vllm` extra only if you want fast colocated generation
# ON THIS machine (a remote grader server needs nothing installed here).
train = [
    "torch==2.8.0",
    "trl>=0.15",
    "transformers>=4.51",
    "peft>=0.14",
    "accelerate>=1.2",
]

# Optional: fast generation during training via colocated vLLM. Heavy install;
# skip it if the grader is remote and you're fine with slower HF generation
# (run train.py with --no-use-vllm in that case). vllm>=0.10.1 supports torch 2.8.
vllm = ["vllm>=0.10.1"]

# Pull the CUDA 12.8 torch build (matches the image), not the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
