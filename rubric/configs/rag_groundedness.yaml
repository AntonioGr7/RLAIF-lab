# RAG groundedness / faithful abstention experiment.
#   python tasks/rag_groundedness.py           # build the data first
#   python train.py --config configs/rag_groundedness.yaml
#
# The reward is the mean of two reference-free rubric criteria: (1) grounded —
# no claim beyond the passage; (2) appropriate — answers when answerable, abstains
# when not. Watch that reward rises WITHOUT the model collapsing to always-abstain
# (that's why the data is 50/50; see tasks/rag_groundedness.py).

# Model / data
model: Qwen/Qwen2.5-7B-Instruct
train_jsonl: example_data/rag_groundedness_train.jsonl
output_dir: outputs/rag-groundedness-grpo

# GRPO core
num_generations: 8
per_device_batch: 8
grad_accum: 8
learning_rate: 1.0e-6
beta: 0.02                     # KL leash ON — groundedness rewards are gameable
temperature: 1.0
max_prompt_length: 1024        # passages are long
max_completion_length: 256     # room for a real answer or an abstention
max_steps: 500

# LoRA
lora_rank: 32
lora_alpha: 64

# vLLM (colocated)
vllm_gpu_mem: 0.4

# Logging
logging_steps: 1
save_steps: 50
wandb_project: rubric-rlaif

# Grader (reference-free): it judges groundedness + answer/abstain from the
# passage alone. Use a STRONG grader — it IS the reward. Validate its agreement
# with human labels before trusting it.
grader:
  model: Qwen/Qwen2.5-72B-Instruct
  temperature: 0.0
  max_tokens: 1024             # room to reason before the <score>
  max_concurrency: 32
  on_error: raise
  # Hosted OpenAI teacher instead:
  #   base_url: null           # set GRADER_API_KEY in env
  #   model: gpt-4o
  #   max_concurrency: 8
